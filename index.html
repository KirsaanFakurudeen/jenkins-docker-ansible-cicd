<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Pipeline Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f6f8;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 60%;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>CI/CD Pipeline Demo</h1>
        <p>Jenkins + Docker + Ansible</p>

        <div class="status">
            Application deployed successfully!
        </div>
    </div>
</body>
</html>
